<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 背景グラデーション (Indigo ~ Deep Violet) -->
    <linearGradient id="sf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>

    <!-- 音波バー用グラデーション (アクティブなフロー感) -->
    <linearGradient id="sf-wave" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- スパークル用グラデーション (輝くゴールド & アンバー) -->
    <linearGradient id="sf-sparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- 柔らかなドロップシャドウ -->
    <filter id="sf-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1E1B4B" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 角丸スクワークル背景 (アプリアイコンベース) -->
  <rect width="512" height="512" rx="120" fill="url(#sf-bg)"/>

  <!-- 上部の微細なグロス・ハイライト -->
  <path d="M 0,120 C 0,53.7 53.7,0 120,0 L 392,0 C 458.3,0 512,53.7 512,120 C 350,140 160,170 0,260 Z" fill="#FFFFFF" fill-opacity="0.08"/>

  <!-- スピーチバブル (純白 + ソフトシャドウ) -->
  <g filter="url(#sf-shadow)">
    <path d="
      M 152,150 
      H 356 
      A 56,56 0 0 1 412,206 
      V 298 
      A 56,56 0 0 1 356,354 
      H 210 
      L 125,416 
      C 112,425 96,415 96,398 
      L 96,206 
      A 56,56 0 0 1 152,150 
      Z" 
      fill="#FFFFFF"
    />
  </g>

  <!-- 音波バー (Flow Waves: スピーキングのリズムと流暢さを表現) -->
  <rect x="179" y="226" width="22" height="52" rx="11" fill="url(#sf-wave)"/>
  <rect x="223" y="204" width="22" height="96" rx="11" fill="url(#sf-wave)"/>
  <rect x="267" y="190" width="22" height="124" rx="11" fill="url(#sf-wave)"/>
  <rect x="311" y="217" width="22" height="70" rx="11" fill="url(#sf-wave)"/>

  <!-- AIの輝き: Sparkles (HeaderのSparklesアイコンと連動) -->
  <!-- メイン Sparkle (右上) -->
  <path d="
    M 395,70 
    Q 395,115 440,115 
    Q 395,115 395,160 
    Q 395,115 350,115 
    Q 395,115 395,70 
    Z" 
    fill="url(#sf-sparkle)"
  />
  <!-- サブ Sparkle (小さめ) -->
  <path d="
    M 335,72 
    Q 335,90 353,90 
    Q 335,90 335,108 
    Q 335,90 317,90 
    Q 335,90 335,72 
    Z" 
    fill="url(#sf-sparkle)"
    opacity="0.9"
  />
</svg>